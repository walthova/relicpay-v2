# RelicPay on Base (EVM). Foundry project.
#   contracts/      existing EVM v2 RWA contracts (RelicPay.sol and friends), unchanged
#   contracts/base/ two-chain parity core: escrow BNPL, staking, credit line, agent delegate
#   test/foundry/   existing invariant suite for contracts/RelicPay.sol
#   test/base/      parity, credit and agent tests for contracts/base
[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 2
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[fuzz]
runs = 256
