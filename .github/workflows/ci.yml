name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-guard:
    name: Test guard (no weakened tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/test-guard-test.js
      - name: Check this push or PR for weakened tests
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          node scripts/test-guard.js --base "$BASE"

  program:
    name: Program (fmt + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --manifest-path programs/relicpay/Cargo.toml

  app:
    name: Demo app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json
      # The merchant page imports packages/checkout, which resolves
      # @solana/web3.js from the root workspace's node_modules.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  extension:
    name: Extension (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # background.js is an ES module (MV3 service worker); check it as one.
      - run: |
          for f in extension/src/*.js; do
            if grep -q '^import ' "$f"; then
              cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs"
            else
              node --check "$f"
            fi
          done
