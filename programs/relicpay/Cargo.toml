[package]
name = "relicpay"
version = "2.0.0"
description = "Relic Pay v2 — Decentralized BNPL on Solana using USDC"
edition = "2021"
# Matches the Rust shipped in the Solana platform-tools used to build the SBF
# binary; keeps dependency resolution on versions that toolchain can compile.
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "relicpay"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token"] }
